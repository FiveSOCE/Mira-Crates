name: Release v0.2.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.2.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: cd5630076aa302995eb4e62ceb0280534c9f92e6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.1 \
            build/libs/MiraCrates-0.2.1.jar \
            --target cd5630076aa302995eb4e62ceb0280534c9f92e6 \
            --title "MiraCrates v0.2.1" \
            --notes "GUI interaction hotfix. Crate-name anvils now generate a clickable confirmation result from the typed name, and the crate editor now allows safe normal left/right inventory clicks so admins can place reward items on the cursor while keeping shift/hotbar transfer paths blocked."
