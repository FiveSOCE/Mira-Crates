name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiraCrates-0.3.10
          path: build/libs/MiraCrates-0.3.10.jar
          if-no-files-found: error

      - name: Publish v0.3.10 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.3.10 >/dev/null 2>&1; then
            gh release create v0.3.10 \
              build/libs/MiraCrates-0.3.10.jar \
              --target "${{ github.sha }}" \
              --title "MiraCrates v0.3.10" \
              --notes "Adds GUI-managed console command rewards. Admins can add a server-level command reward from Edit Crate, use %player% for the winner, and configure its chance and rarity like item rewards. Existing COMMAND rewards become editable in the same reward grid."
          fi
