name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiraCrates-0.3.11
          path: build/libs/MiraCrates-0.3.11.jar
          if-no-files-found: error

      - name: Publish v0.3.11 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.3.11 >/dev/null 2>&1; then
            gh release create v0.3.11 \
              build/libs/MiraCrates-0.3.11.jar \
              --target "${{ github.sha }}" \
              --title "MiraCrates v0.3.11" \
              --notes "Extends the CS2-style horizontal crate reel from the old 24-step default to 40 steps while preserving its current speed, and synchronizes a dedicated crate spin tick event to every reel movement."
          fi
