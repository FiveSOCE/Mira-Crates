name: Compatibility Builds

on:
  push:
    branches: [main, "compat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-1-18:
    name: Legacy build (Paper 1.18.2 / Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build legacy target
        run: gradle clean test build -Ptarget=legacy -PpaperApiVersion=1.18.2-R0.1-SNAPSHOT -PcompileJavaVersion=17 -PbytecodeJavaVersion=17 --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraCrates-Legacy
          path: build/libs/MiraCrates-Legacy-*.jar
          if-no-files-found: error

  modern-26-2:
    name: Modern build (Paper 26.2 / Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build modern target
        run: gradle clean test build -Ptarget=modern -PpaperApiVersion=26.2.build.121-stable -PcompileJavaVersion=25 -PbytecodeJavaVersion=25 --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraCrates-Modern
          path: build/libs/MiraCrates-Modern-*.jar
          if-no-files-found: error
