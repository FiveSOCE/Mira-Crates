name: Release v0.2.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.2.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 8b3efdbb05b1297edf63d2658752e483c55d6adf

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.2 \
            build/libs/MiraCrates-0.2.2.jar \
            --target 8b3efdbb05b1297edf63d2658752e483c55d6adf \
            --title "MiraCrates v0.2.2" \
            --notes "Crate naming workflow hotfix. The anvil naming UI has been removed. Clicking Crate Name now closes the editor and privately captures the admin's next chat message as the crate name. That message is cancelled and removed from chat recipients so it is not broadcast, then the crate editor reopens with the captured name applied."
