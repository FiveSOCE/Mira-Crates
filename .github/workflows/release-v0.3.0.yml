name: Release v0.3.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.3.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: fded6239ea6e62ecdf3171cc5576e59e1ab7e631

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.0 \
            build/libs/MiraCrates-0.3.0.jar \
            --target fded6239ea6e62ecdf3171cc5576e59e1ab7e631 \
            --title "MiraCrates v0.3.0" \
            --notes "Mandatory crate keys and opening improvements. Every crate now automatically gets a matching physical companion key, legacy keyless crates are migrated on load, physical openings require the correct key in the player's main hand, crouch-right-click quick-opens without the roulette GUI, normal roulette duration is extended to six seconds, and the Keys GUI can give admins 1 or 10 keys without commands."
