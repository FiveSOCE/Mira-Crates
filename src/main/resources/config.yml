config-version: 5

opening:
  # Fast CS2-style horizontal reward reel.
  slider-steps: 24
  slider-interval-ticks: 2
  winner-hold-ticks: 8

interaction:
  preview-on-left-click: true
  open-on-right-click: true
  target-distance: 6

holograms:
  enabled: true
  height: 1.65

rare-win:
  rarities:
    - legendary
    - mythic
    - jackpot
  message: "&6[Jackpot] &f%player% &7won %reward% &7from %crate%&7!"

# Add crate IDs here for date-limited seasonal availability.
# Times use ISO-8601 UTC timestamps.
seasonal-crates:
  example_christmas:
    enabled: false
    start: "2026-12-01T00:00:00Z"
    end: "2027-01-01T00:00:00Z"

history:
  enabled: true

editor:
  title: "&5MiraCrates Editor"
