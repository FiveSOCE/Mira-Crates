name: MiraCrates
version: 0.3.2
main: com.mira.crates.MiraCratesPlugin
api-version: '1.21'
authors: [FiveS]
description: GUI-first shulker crates, mandatory keys, weighted rewards and crate holograms for the Mira plugin ecosystem.
depend: [MiraCore]
softdepend: [MiraSpawners, Holograms]

commands:
  miracrates:
    description: MiraCrates editor, administration and diagnostics.
    usage: /miracrates [create|givecrate|remove|help]
    aliases: [mcrates, mcrate]
    permission: miracrates.admin

permissions:
  miracrates.admin:
    description: Access to MiraCrates administration and editor commands.
    default: op
  miracrates.use:
    description: Allows opening physical crates with a valid key.
    default: true
  miracrates.preview:
    description: Allows previewing physical crate rewards.
    default: true
