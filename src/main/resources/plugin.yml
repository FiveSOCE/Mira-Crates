name: MiraCrates
version: 0.3.12
main: com.mira.crates.MiraCratesPlugin
api-version: '1.21'
authors: [FiveS]
description: GUI-first crates with rare-win broadcasts, jackpot data and seasonal activation windows.
depend: [MiraCore]
softdepend: [MiraSpawners, Holograms, PlaceholderAPI, MiraNPC, MiraCosmetics]

commands:
  miracrates:
    description: MiraCrates administration and diagnostics.
    usage: /miracrates [create|givecrate|remove|change|help]
    aliases: [mcrates, mcrate]
    permission: miracrates.admin

permissions:
  miracrates.admin:
    description: Access to MiraCrates administration, editor, crate conversion and key tools.
    default: op
  miracrates.use:
    description: Allows opening physical crates with a valid key.
    default: true
  miracrates.preview:
    description: Allows previewing physical crate rewards by left-clicking them.
    default: true
