name: MiraCrates
version: 0.2.0
main: com.mira.crates.MiraCratesPlugin
api-version: '1.21'
authors: [FiveS]
description: GUI-first shulker crates, keys and weighted rewards for the Mira plugin ecosystem.
depend: [MiraCore]
softdepend: [MiraSpawners]

commands:
  miracrates:
    description: MiraCrates editor, administration and diagnostics.
    usage: /miracrates [create|givecrate|help]
    aliases: [mcrates, mcrate]
    permission: miracrates.admin

permissions:
  miracrates.admin:
    description: Access to MiraCrates administration and editor commands.
    default: op
  miracrates.use:
    description: Allows opening physical crates.
    default: true
  miracrates.preview:
    description: Allows previewing physical crate rewards.
    default: true
